name: Trigger Vercel on Label

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: read

jobs:
  trigger-vercel:
    if: github.event.label.name == 'deploy preview'
    runs-on: ubuntu-latest
    steps:
      - name: Push empty commit to re-trigger Vercel
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.payload.pull_request.head.repo.owner.login;
            const repo = context.payload.pull_request.head.repo.name;
            const ref = context.payload.pull_request.head.ref;

            const { data: refData } = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${ref}`,
            });

            const latestSha = refData.object.sha;

            const { data: commit } = await github.rest.git.getCommit({
              owner,
              repo,
              commit_sha: latestSha,
            });

            const { data: emptyCommit } = await github.rest.git.createCommit({
              owner,
              repo,
              message: 'chore: re-trigger Vercel preview deploy',
              tree: commit.tree.sha,
              parents: [latestSha],
            });

            await github.rest.git.updateRef({
              owner,
              repo,
              ref: `heads/${ref}`,
              sha: emptyCommit.sha,
            });

            core.info(`Pushed empty commit ${emptyCommit.sha} to ${ref}`);
