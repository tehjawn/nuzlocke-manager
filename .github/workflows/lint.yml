name: Lint

# Catches ESLint errors and prisma schema problems before they reach main.
# Production builds are the only gate today, so failures like #313 land on
# main and only surface on Vercel.
#
# Runs on every PR rather than filtering on paths, so it can be made a required
# check without leaving PRs that touch no lintable files waiting on a run that
# never starts. Keeps jobs cheap: one checkout, one npm ci, no database.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # CI resolves from package-lock.json; pnpm-lock.yaml is gitignored.
      # postinstall runs prisma generate, so no separate generate step.
      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prisma validate
        run: npx prisma validate
