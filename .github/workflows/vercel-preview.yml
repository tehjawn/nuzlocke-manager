name: Vercel Preview Deploy

# Preview environments are opt-in. Vercel's Git integration skips automatic
# preview builds (see vercel.json ignoreCommand). This workflow deploys when a
# PR has the "deploy preview" label — on label add and on subsequent pushes.

on:
  pull_request:
    types: [labeled, synchronize, reopened, ready_for_review]

concurrency:
  group: vercel-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(join(github.event.pull_request.labels.*.name, ','), 'deploy preview') &&
      (github.event.action != 'labeled' || github.event.label.name == 'deploy preview')
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_e42hUAqZYBofXWplQu3PWQDQ
      VERCEL_PROJECT_ID: prj_oSFMhOd1eYpRT63wcLWwZToPSImh
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Require VERCEL_TOKEN
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Missing repository secret VERCEL_TOKEN. Create a full account token at https://vercel.com/account/tokens (not a scoped/custom project token) and add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          code="$(curl -sS -o /tmp/vercel-user.json -w '%{http_code}' -H "Authorization: Bearer $VERCEL_TOKEN" https://api.vercel.com/v2/user || true)"
          if [ "$code" != "200" ]; then
            echo "::error::VERCEL_TOKEN cannot load /v2/user (HTTP $code). The Vercel CLI needs a full account token. Scoped tokens (e.g. vcp_…) can access the project API but fail on vercel pull/deploy with 'Could not retrieve Project Settings'."
            head -c 300 /tmp/vercel-user.json || true
            echo
            exit 1
          fi

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # --- Per-PR Neon branch -------------------------------------------------
      # Previews must never resolve to the production database. If any step here
      # fails we abort rather than fall through to the shared Preview env vars,
      # which still point at production.

      - name: Require Neon configuration
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            echo "::error::Missing NEON_API_KEY secret or NEON_PROJECT_ID variable. Install the Neon GitHub integration; previews must not fall back to the production database."
            exit 1
          fi

      - name: Branch expiry backstop
        run: echo "EXPIRES_AT=$(date -u -d '+7 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      # Reuses the branch when it already exists (`created` reports which), so
      # this is safe to re-run on every push to a labelled PR.
      - name: Create or reuse Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.pull_request.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ env.EXPIRES_AT }}

      - name: Mask and verify the branch is not production
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
          CHILD_DIRECT: ${{ steps.neon.outputs.db_url }}
          CHILD_POOLED: ${{ steps.neon.outputs.db_url_pooled }}
          EXPECTED_NAME: preview/pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          for v in "$CHILD_DIRECT" "$CHILD_POOLED"; do
            [ -n "$v" ] && echo "::add-mask::$v"
          done

          if [ -z "$CHILD_DIRECT" ] || [ -z "$CHILD_POOLED" ]; then
            echo "::error::Neon returned an empty connection string. Check the action's output names against the pinned version."
            exit 1
          fi

          branch="$(
            curl -sS --fail-with-body \
              -H "Authorization: Bearer $NEON_API_KEY" \
              "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$BRANCH_ID"
          )"
          name="$(printf '%s' "$branch" | jq -r '.branch.name')"
          is_default="$(printf '%s' "$branch" | jq -r '.branch.default')"
          parent="$(printf '%s' "$branch" | jq -r '.branch.parent_id // empty')"

          if [ "$name" != "$EXPECTED_NAME" ]; then
            echo "::error::Branch name '$name' does not match expected '$EXPECTED_NAME'."
            exit 1
          fi
          if [ "$is_default" = "true" ] || [ -z "$parent" ]; then
            echo "::error::Refusing to use branch '$name' — it is the default branch or has no parent."
            exit 1
          fi

          echo "Using Neon branch $name ($BRANCH_ID), created=${{ steps.neon.outputs.created }}."
          {
            echo "CHILD_DIRECT=$CHILD_DIRECT"
            echo "CHILD_POOLED=$CHILD_POOLED"
          } >> "$GITHUB_ENV"

      # Runs before the build: `next build` prerenders pages that query the
      # database, so the schema has to be current first.
      - name: Migrate the child branch
        env:
          DATABASE_URL_UNPOOLED: ${{ env.CHILD_DIRECT }}
        run: |
          npm ci
          npm run db:migrate:deploy

      # --- Stable preview hostname -------------------------------------------
      # Claimed before the build because NEXT_PUBLIC_APP_URL is inlined at build
      # time, so the slot has to be known before `vercel build` runs.
      - name: Claim a preview alias slot
        id: slot
        run: |
          chmod +x scripts/vercel-preview-slot.sh
          scripts/vercel-preview-slot.sh claim "${{ github.event.pull_request.number }}" >/dev/null

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      # `vercel pull` writes the shared Preview env — which points at production —
      # into .vercel/.env.preview.local, and `vercel build` reads that file in
      # preference to the process environment. It has to be rewritten here, not
      # just exported. Verified: the build fails without a reachable database.
      - name: Point the build at the child branch
        env:
          SLOT_URL: ${{ steps.slot.outputs.url }}
        run: |
          set -euo pipefail
          f=.vercel/.env.preview.local
          if [ ! -f "$f" ]; then
            echo "::error::$f not found; vercel pull did not produce a preview env file."
            exit 1
          fi
          sed -i '/^DATABASE_URL=/d; /^DATABASE_URL_UNPOOLED=/d' "$f"
          printf 'DATABASE_URL="%s"\n' "$CHILD_POOLED" >> "$f"
          printf 'DATABASE_URL_UNPOOLED="%s"\n' "$CHILD_DIRECT" >> "$f"
          echo "Rewrote DATABASE_URL / DATABASE_URL_UNPOOLED to the child branch."

          # NEXT_PUBLIC_* is inlined into the client bundle at build time, so the
          # slot URL has to be in place here rather than passed at deploy time.
          sed -i '/^NEXT_PUBLIC_APP_URL=/d; /^AUTH_URL=/d' "$f"
          printf 'NEXT_PUBLIC_APP_URL="%s"\n' "$SLOT_URL" >> "$f"
          printf 'AUTH_URL="%s"\n' "$SLOT_URL" >> "$f"
          echo "Pinned NEXT_PUBLIC_APP_URL / AUTH_URL to $SLOT_URL."

      - name: Build preview
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy preview
        id: deploy
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          # Do not pass --target=preview. It makes Vercel evaluate the Ignored
          # Build Step (vercel.json ignoreCommand), which exits 0 for anything
          # that is not VERCEL_ENV=production and cancels the deployment.
          # Preview is already the default; --prod is what selects production,
          # so omitting the flag still satisfies "never deploy to production".
          url="$(
            vercel deploy --prebuilt --token="$VERCEL_TOKEN" \
              --env "DATABASE_URL=${CHILD_POOLED}" \
              --env "DATABASE_URL_UNPOOLED=${CHILD_DIRECT}" \
              --meta "githubPrId=${PR_NUMBER}" \
              --meta "githubCommitRef=${HEAD_REF}" \
              --meta "deployPreviewLabel=1" \
              --meta "neonBranch=preview/pr-${PR_NUMBER}" \
              | tee /dev/stderr | tail -n1
          )"
          if [ -z "$url" ] || [[ "$url" != https://* ]]; then
            echo "::error::Vercel did not return a preview URL (got: ${url:-empty})"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $url"

      # Discord only accepts redirect URIs registered ahead of time, so login
      # works through the slot hostname, not the hashed deployment URL.
      - name: Alias the deployment to the preview slot
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          SLOT_HOST: ${{ steps.slot.outputs.host }}
        run: |
          set -euo pipefail
          vercel alias set "$DEPLOY_URL" "$SLOT_HOST" --token="$VERCEL_TOKEN"
          echo "Aliased $DEPLOY_URL → https://$SLOT_HOST"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            if (!url) {
              core.setFailed('Missing preview URL from deploy step');
              return;
            }

            const marker = '<!-- vercel-preview-bot -->';
            const slotUrl = process.env.SLOT_URL;
            const body = [
              marker,
              `**Vercel Preview** for \`${context.payload.pull_request.head.sha.slice(0, 7)}\`:`,
              slotUrl || url,
              '',
              ...(slotUrl
                ? [`Sign in works on this URL only — the deployment URL (${url}) is not a registered Discord redirect.`, '']
                : []),
              `Database: Neon branch \`${process.env.NEON_BRANCH}\` — isolated from production.`,
              'Removing the `deploy preview` label, merging, or closing releases the slot and deletes the branch.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          SLOT_URL: ${{ steps.slot.outputs.url }}
          NEON_BRANCH: preview/pr-${{ github.event.pull_request.number }}
