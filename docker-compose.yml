services:
  postgres:
    image: postgres:16
    container_name: nuzlocke-pg
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nuzlocke
      POSTGRES_PASSWORD: nuzlocke
      POSTGRES_DB: nuzlocke_manager
    volumes:
      - nuzlocke_pg_data:/var/lib/postgresql/data

volumes:
  nuzlocke_pg_data:
